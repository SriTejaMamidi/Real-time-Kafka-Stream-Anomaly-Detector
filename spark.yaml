# PySpark Streaming Configuration
spark:
  app_name: "KafkaAnomalyDetection"
  master: "local[4]"

  config:
    spark.sql.shuffle.partitions: 12
    spark.default.parallelism: 8
    spark.streaming.kafka.maxRatePerPartition: 10000

streaming:
  batch_duration: 5  # seconds
  checkpoint_dir: "checkpoint_kafka_anomaly"

memory:
  driver_memory: "4g"
  executor_memory: "8g"
  executor_cores: 4
